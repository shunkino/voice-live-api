# Behavioral Adherence Evaluator
# 評価対象: response_instructions に基づく行動準拠度
# カテゴリ: quality

name: behavioral_adherence
display_name: "Behavioral Adherence"
description: |
  Evaluates whether the agent's response strictly follows the
  response_instructions generated by the ScenarioEngine for the current state.
  Checks for instruction compliance, tone, and content accuracy.

version: "1.0"
category: quality

annotation:
  type: llm_judge
  model_deployment: gpt-5.2

scoring:
  scale: 1-5
  criteria:
    5: "応答が response_instructions に完全に準拠し、指定されたトーン・内容・行動を全て正確に実行。"
    4: "ほぼ準拠しているが、軽微な表現の差異がある。ユーザー体験に影響なし。"
    3: "instructions の主要な指示には従っているが、一部の詳細を見落としている。"
    2: "instructions の主要な指示を部分的にしか守っていない。ユーザー体験に影響あり。"
    1: "instructions をほぼ無視した応答。異なる行動をとっている。"

prompt_template: |
  あなたは音声エージェントの品質評価者です。
  エージェントの応答が、シナリオエンジンから与えられた response_instructions に
  どの程度準拠しているかを評価してください。

  ## 評価対象
  - ユーザー入力: {{query}}
  - エージェント応答: {{response}}
  - response_instructions: {{expected_behavior}}
  - 現在のコンテキスト: {{context}}

  ## 評価基準
  1 = instructions を無視  |  5 = 完全準拠

  ## 出力形式
  score: <1-5>
  reasoning: <評価理由>

column_mapping:
  query: "${data.query}"
  response: "${data.response}"
  expected_behavior: "${data.expected_behavior}"
  context: "${data.context}"

threshold: 4.0
